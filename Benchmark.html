<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraceFlow Tech — Dynamic Motion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Continuous floating motion keyframes */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    .animate-glow {
      animation: pulseGlow 8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased overflow-x-hidden">

  <!-- Hero Section with Animated Ambient Objects -->
  <section class="relative py-28 px-6 min-h-screen flex items-center justify-center">
    
    <!-- Moving Ambient Orbs in Background -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/30 rounded-full filter blur-3xl animate-glow pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/30 rounded-full filter blur-3xl animate-glow pointer-events-none" style="animation-delay: -4s;"></div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10">
      
      <!-- Text & Interactive Content -->
      <div>
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight mb-6">
          Bring Your Pages to Life with <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">Fluid Motion.</span>
        </h1>
        <p class="text-lg text-slate-300 mb-8 max-w-xl">
          Integrate GPU-accelerated video frames and smooth vector motion directly into your digital workspace.
        </p>
        <div class="flex gap-4">
          <button class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg shadow-lg shadow-indigo-500/30 transition hover:scale-105 transform">
            Get Started
          </button>
        </div>
      </div>

      <!-- Moving Object 1: Floating Card with Embedded Video Background -->
      <div class="relative animate-float">
        <div class="relative bg-slate-900/80 border border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-xl">
          
          <!-- Video Background Layer -->
          <div class="relative h-64 sm:h-80 w-full overflow-hidden">
            <video 
              autoplay 
              loop 
              muted 
              playsinline 
              class="absolute inset-0 w-full h-full object-cover opacity-60">
              <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-network-lines-27661-large.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
          </div>

          <!-- Card Content Overlay -->
          <div class="p-6 relative z-10 -mt-12">
            <span class="px-3 py-1 bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-semibold rounded-full uppercase">
              Live Preview
            </span>
            <h3 class="text-xl font-bold mt-2">Dynamic Video Card</h3>
            <p class="text-slate-400 text-sm mt-1">Background video integrated directly inside card components.</p>
          </div>

        </div>
      </div>

    </div>
  </section>

</body>
</html>
