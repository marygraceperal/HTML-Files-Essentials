/* =========================================================
   GRACEFLOW TECH — DESIGN SYSTEM
========================================================= */

:root{

    /* Brand */
    --navy:#171A3A;
    --navy-2:#202653;
    --blue:#3155D9;
    --blue-light:#6F91FF;
    --violet:#6C4BEF;
    --purple:#9B7BFF;
    --teal:#35B8B0;
    --gold:#E6B65C;

    /* Surfaces */
    --white:#FFFFFF;
    --bg:#F7F8FC;
    --surface:#FFFFFF;
    --surface-soft:#F0EDFF;
    --surface-blue:#EDF2FF;

    /* Text */
    --text:#171A3A;
    --text-soft:#4F5872;
    --muted:#6D7388;
    --muted-light:#9298AB;

    /* Lines */
    --line:rgba(23,26,58,.09);
    --line-strong:rgba(23,26,58,.14);

    /* Effects */
    --shadow-sm:0 8px 25px rgba(23,26,58,.055);
    --shadow-md:0 18px 45px rgba(23,26,58,.09);
    --shadow-lg:0 30px 80px rgba(23,26,58,.13);

    /* Radius */
    --radius-sm:12px;
    --radius-md:18px;
    --radius-lg:26px;
    --radius-xl:34px;

    /* Layout */
    --container:1180px;

    /* Motion */
    --ease:cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    overflow-x:hidden;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

img,
svg{
    display:block;
    max-width:100%;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

::selection{
    color:white;
    background:var(--violet);
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

.skip-link{
    position:fixed;
    top:12px;
    left:12px;
    z-index:9999;
    padding:10px 16px;
    border-radius:10px;
    color:white;
    background:var(--navy);
    transform:translateY(-150%);
    transition:transform .2s ease;
}

.skip-link:focus{
    transform:translateY(0);
}

:focus-visible{
    outline:3px solid var(--purple);
    outline-offset:4px;
}


/* =========================================================
   GLOBAL
========================================================= */

.container{
    width:min(
        var(--container),
        calc(100% - 40px)
    );
    margin-inline:auto;
}

.section{
    position:relative;
    padding:110px 0;
}

.section-label{
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:var(--violet);
    font-size:.7rem;
    font-weight:850;
    letter-spacing:.2em;
    text-transform:uppercase;
}

.section-label::before{
    content:"";
    width:26px;
    height:2px;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        var(--blue),
        var(--violet)
    );
}

.section-heading{
    max-width:820px;
}

.section-heading.center{
    margin-inline:auto;
    text-align:center;
}

.section-heading h2{
    margin:12px 0 17px;
    font-size:clamp(2.5rem,5vw,4.35rem);
    line-height:.99;
    letter-spacing:-.055em;
}

.section-heading h2 span{
    background:
        linear-gradient(
            100deg,
            var(--blue),
            var(--violet),
            var(--purple)
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.section-heading p{
    max-width:720px;
    margin:0;
    color:var(--text-soft);
    font-size:1rem;
    line-height:1.75;
}

.section-heading.center p{
    margin-inline:auto;
}

.reveal{
    opacity:0;
    transform:translateY(24px);
    transition:
        opacity .7s var(--ease),
        transform .7s var(--ease);
}

.reveal.is-visible{
    opacity:1;
    transform:none;
}

.welcome-content{

.welcome h1{

.gradient-text{

            var(--purple),
            var(--blue)
        );
    background-size:220% 100%;

    background-clip:text;
    color:transparent;
    animation:shimmer 8s ease-in-out infinite;

    0%,100%{

.welcome-company{

.welcome-line{

    font-weight:800;
    letter-spacing:.2em;
}
