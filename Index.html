<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Viewing Repository</title>
  <style>
    :root{
      --navy:#17365d;
      --blue:#2f75b5;
      --teal:#2f8f9d;
      --gold:#d6b656;
      --ink:#243447;
      --muted:#6b7785;
      --bg:#f4f8fc;
      --card:#ffffff;
      --line:#dce6f0;
      --danger:#b42318;
      --shadow:0 10px 30px rgba(23,54,93,.10);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#edf5fb 0%,var(--bg) 45%,#fff 100%);
      min-height:100vh;
    }
    header{
      background:linear-gradient(135deg,var(--navy),var(--blue));
      color:#fff;
      padding:28px 18px 34px;
      text-align:center;
    }
    header h1{margin:0;font-size:clamp(25px,5vw,38px)}
    header p{margin:8px 0 0;opacity:.9}
    main{max-width:1100px;margin:-18px auto 50px;padding:0 16px}
    .panel{
      background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;
    }
    .section-title{margin:0 0 14px;font-size:20px;color:var(--navy)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .level-card,.section-card,.student-card,.subject-card{
      border:1px solid var(--line);background:#fff;border-radius:18px;
      padding:20px;cursor:pointer;transition:.18s ease;
      width:100%;font:inherit;color:var(--ink);text-align:left;
      appearance:none;-webkit-appearance:none;
    }
    .level-card:hover,.section-card:hover,.student-card:hover,.subject-card:hover{
      transform:translateY(-2px);box-shadow:0 8px 20px rgba(23,54,93,.10);border-color:#b8d1e8;
    }
    .level-card:focus-visible,.section-card:focus-visible,.student-card:focus-visible,.subject-card:focus-visible{
      outline:3px solid rgba(47,117,181,.30);outline-offset:2px;
    }
    .level-card .icon{font-size:34px}.level-card h3,.student-card h3{margin:10px 0 4px}
    .muted{color:var(--muted);font-size:14px}
    .crumbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:14px}
    .crumbs button{border:0;background:none;color:var(--blue);cursor:pointer;padding:0}
    .student-card{display:flex;align-items:center;gap:14px}
    .avatar{
      width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
      background:#e5f0fa;color:var(--navy);font-weight:bold;font-size:18px;flex:none;
    }
    .subject-card{text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .subject-icon{font-size:42px}
    .subject-card h3{font-size:16px;margin:10px 0 0}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f4;color:#28737b;font-size:12px;margin-top:8px}
    .hidden{display:none!important}
    .empty{text-align:center;padding:35px;color:var(--muted)}
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(10,28,46,.55);display:grid;place-items:center;
      padding:18px;z-index:20;
    }
    .modal{
      width:min(430px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.25)
    }
    .modal h2{margin:0;color:var(--navy)}
    .modal input{
      width:100%;padding:14px 15px;border:1px solid #cbd8e4;border-radius:12px;
      font-size:20px;letter-spacing:5px;margin:14px 0;outline:none;
    }
    .modal input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e4f0fa}
    .actions{display:flex;gap:10px;justify-content:flex-end}
    button.primary,button.secondary{
      border:0;border-radius:12px;padding:11px 16px;font-weight:bold;cursor:pointer
    }
    button.primary{background:var(--blue);color:#fff}
    button.secondary{background:#edf2f6;color:var(--ink)}
    .error{color:var(--danger);font-size:14px;min-height:20px}
    .student-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}
    .logout{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:10px;cursor:pointer}
    .grade-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .grade-icon{font-size:38px}
    .term{
      border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0;background:#fff
    }
    .term-title{background:#f0f6fb;padding:12px 15px;font-weight:bold;color:var(--navy)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right}
    th:first-child,td:first-child{text-align:left}
    th{font-size:13px;color:var(--muted);font-weight:bold}
    td{font-size:15px}
    tr:last-child td{border-bottom:0}
    .final{font-weight:bold;color:var(--navy)}
    .loading{padding:30px;text-align:center;color:var(--muted)}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
    @media(max-width:600px){
      main{padding:0 10px}
      .panel{padding:16px}
      th,td{padding:10px 8px;font-size:13px}
      .student-head{display:block}
      .logout{margin-top:10px}
    }
  </style>
</head>
<body>
<header>
  <h1 id="appTitle">Grade Viewing Repository</h1>
  <p id="schoolName">Loading...</p>
</header>

<main>
  <section id="browseView" class="panel">
    <div id="breadcrumbs" class="crumbs"></div>
    <h2 id="browseTitle" class="section-title">Select Grade Level</h2>
    <div id="browseGrid" class="grid"></div>
  </section>

  <section id="dashboardView" class="panel hidden">
    <div class="student-head">
      <div>
        <div class="muted">Authenticated student</div>
        <h2 id="studentName" class="section-title" style="margin-bottom:4px"></h2>
        <div id="studentMeta" class="muted"></div>
      </div>
      <button class="logout" onclick="logout()">Log Out</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <h3 class="section-title">Subjects</h3>
    <div id="subjectGrid" class="grid"></div>
  </section>

  <section id="gradeView" class="panel hidden">
    <div class="crumbs"><button onclick="showDashboard()">← Back to Subjects</button></div>
    <div id="gradeContent"></div>
  </section>
</main>

<footer>Grade Viewing Repository • Google Sheets + Apps Script</footer>

<div id="loginModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>🔐 Secure Access</h2>
    <p id="loginStudent" class="muted"></p>
    <input id="passcode" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit passcode" onkeydown="if(event.key==='Enter') submitLogin()">
    <div id="loginError" class="error"></div>
    <div class="actions">
      <button class="secondary" onclick="closeLogin()">Cancel</button>
      <button class="primary" onclick="submitLogin()">Enter</button>
    </div>
  </div>
</div>

<script>
  let DATA = null;
  let selectedGrade = null;
  let selectedSection = null;
  let selectedStudent = null;
  let pendingStudent = null;
  let authenticatedStudent = null;

  function init(){
    google.script.run
      .withSuccessHandler(data => {
        DATA = data;
        document.getElementById('appTitle').textContent = data.settings['Repository Title'] || 'Grade Viewing Repository';
        document.getElementById('schoolName').textContent = data.settings['School Name'] || '';
        renderGrades();
      })
      .withFailureHandler(err => showError(err))
      .getInitialData();
  }

  function renderGrades(){
    selectedGrade = null; selectedSection = null;
    document.getElementById('browseTitle').textContent = 'Select Grade Level';
    document.getElementById('breadcrumbs').innerHTML = '';
    const grades = [...new Set(DATA.students.map(s => s.gradeLevel))];
    const grid = document.getElementById('browseGrid');

    if (!grades.length) {
      grid.innerHTML = '<div class="empty">No active students were found.</div>';
      return;
    }

    grid.innerHTML = grades.map((g, i) => `
      <button type="button" class="level-card" data-action="grade" data-value="${esc(g)}" aria-label="Open ${esc(g)}">
        <div class="icon">🎓</div>
        <h3>${esc(g)}</h3>
        <div class="muted">${DATA.students.filter(s=>s.gradeLevel===g).length} student(s)</div>
      </button>`).join('');

    bindBrowseButtons();
  }

  function bindBrowseButtons(){
    document.querySelectorAll('#browseGrid [data-action="grade"]').forEach(btn => {
      btn.addEventListener('click', () => chooseGrade(btn.dataset.value));
    });
    document.querySelectorAll('#browseGrid [data-action="section"]').forEach(btn => {
      btn.addEventListener('click', () => chooseSection(btn.dataset.value));
    });
    document.querySelectorAll('#browseGrid [data-action="student"]').forEach(btn => {
      btn.addEventListener('click', () => openLogin(btn.dataset.value));
    });
  }

  function chooseGrade(grade){
    selectedGrade = grade;
    const sections = [...new Set(DATA.students.filter(s=>s.gradeLevel===grade).map(s=>s.section))];
    document.getElementById('browseTitle').textContent = grade + ' — Select Section';
    document.getElementById('breadcrumbs').innerHTML = `<button type="button" onclick="renderGrades()">Grade Levels</button> / ${esc(grade)}`;

    document.getElementById('browseGrid').innerHTML = sections.map(sec => `
      <button type="button" class="section-card" data-action="section" data-value="${esc(sec)}" aria-label="Open ${esc(sec)}">
        <div class="icon">🏫</div>
        <h3>${esc(sec)}</h3>
        <div class="muted">${DATA.students.filter(s=>s.gradeLevel===grade && s.section===sec).length} student(s)</div>
      </button>`).join('');

    bindBrowseButtons();
  }

  function chooseSection(section){
    selectedSection = section;
    const students = DATA.students.filter(s=>s.gradeLevel===selectedGrade && s.section===section);
    document.getElementById('browseTitle').textContent = selectedGrade + ' — ' + section;
    document.getElementById('breadcrumbs').innerHTML =
      `<button type="button" onclick="renderGrades()">Grade Levels</button> / ` +
      `<button type="button" onclick="chooseGrade('${esc(selectedGrade)}')">${esc(selectedGrade)}</button> / ${esc(section)}`;

    document.getElementById('browseGrid').innerHTML = students.map(s => `
      <button type="button" class="student-card" data-action="student" data-value="${esc(s.studentId)}" aria-label="Open ${esc(s.name)}">
        <div class="avatar">${esc(initials(s.name))}</div>
        <div>
          <h3>${esc(s.name)}</h3>
          <div class="muted">${esc(s.gradeLevel)} • ${esc(s.section)}</div>
        </div>
      </button>`).join('');

    bindBrowseButtons();
  }

  function openLogin(studentId){
    pendingStudent = DATA.students.find(s=>s.studentId===studentId);
    document.getElementById('loginStudent').textContent = pendingStudent.name + ' • ' + pendingStudent.gradeLevel + ' – ' + pendingStudent.section;
    document.getElementById('passcode').value = '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginModal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('passcode').focus(),50);
  }

  function closeLogin(){
    document.getElementById('loginModal').classList.add('hidden');
    pendingStudent = null;
  }

  function submitLogin(){
    if(!pendingStudent) return;
    const code = document.getElementById('passcode').value.trim();
    if(!/^\d{6}$/.test(code)){
      document.getElementById('loginError').textContent = 'Please enter a 6-digit passcode.';
      return;
    }
    document.getElementById('loginError').textContent = 'Verifying...';
    google.script.run
      .withSuccessHandler(result => {
        if(!result.ok){
          document.getElementById('loginError').textContent = result.message;
          return;
        }
        authenticatedStudent = result;
        closeLogin();
        showDashboard();
      })
      .withFailureHandler(err => {
        document.getElementById('loginError').textContent = 'Unable to verify right now.';
      })
      .authenticate(pendingStudent.studentId, code);
  }

  function showDashboard(){
    if(!authenticatedStudent) return;
    document.getElementById('browseView').classList.add('hidden');
    document.getElementById('gradeView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');

    const s = authenticatedStudent.student;
    document.getElementById('studentName').textContent = s.name;
    document.getElementById('studentMeta').textContent = s.gradeLevel + ' • ' + s.section;

    document.getElementById('subjectGrid').innerHTML = authenticatedStudent.subjects.map(sub => `
      <button type="button" class="subject-card" data-subject-id="${esc(sub.subjectId)}" aria-label="View ${esc(sub.name)} grades">
        <div class="subject-icon">${esc(sub.icon)}</div>
        <h3>${esc(sub.name)}</h3>
        <span class="badge">View Grades</span>
      </button>`).join('');

    document.querySelectorAll('#subjectGrid [data-subject-id]').forEach(btn => {
      btn.addEventListener('click', () => openSubject(btn.dataset.subjectId));
    });
  }

  function openSubject(subjectId){
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('gradeView').classList.remove('hidden');
    document.getElementById('gradeContent').innerHTML = '<div class="loading">Loading grades...</div>';

    google.script.run
      .withSuccessHandler(data => renderGradesTable(data))
      .withFailureHandler(err => {
        document.getElementById('gradeContent').innerHTML = '<div class="empty">Unable to load grades.</div>';
      })
      .getGrades(authenticatedStudent.student.studentId, subjectId);
  }

  function renderGradesTable(data){
    let html = `
      <div class="grade-header">
        <div class="grade-icon">${esc(data.subject.icon)}</div>
        <div><h2 class="section-title" style="margin:0">${esc(data.subject.name)}</h2>
        <div class="muted">${esc(authenticatedStudent.student.name)} • ${esc(authenticatedStudent.student.gradeLevel)} – ${esc(authenticatedStudent.student.section)}</div></div>
      </div>`;
    if(!data.grades.length){
      html += '<div class="empty">No grade records are available for this subject yet.</div>';
    } else {
      data.grades.forEach(g => {
        html += `
          <div class="term">
            <div class="term-title">${esc(g.term)}</div>
            <table>
              <thead><tr><th>Component</th><th>Percentage</th></tr></thead>
              <tbody>
                <tr><td>Written Works</td><td>${fmt(g.written)}%</td></tr>
                <tr><td>Performance Tasks</td><td>${fmt(g.performance)}%</td></tr>
                <tr><td>Examination</td><td>${fmt(g.examination)}%</td></tr>
                <tr><td class="final">Final Grade</td><td class="final">${fmt(g.finalGrade)}%</td></tr>
              </tbody>
            </table>
          </div>`;
      });
    }
    document.getElementById('gradeContent').innerHTML = html;
  }

  function logout(){
    authenticatedStudent = null;
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('gradeView').classList.add('hidden');
    document.getElementById('browseView').classList.remove('hidden');
    renderGrades();
  }

  function fmt(v){ return v === '' || v === null || typeof v === 'undefined' ? '—' : Number(v).toFixed(0); }
  function initials(name){ return String(name).split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase(); }
  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function showError(err){ document.getElementById('browseGrid').innerHTML = '<div class="empty">Unable to load the repository data. Check the spreadsheet ID and sheet names.</div>'; }

  init();
</script>
</body>
</html>
